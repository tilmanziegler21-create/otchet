services:
  - type: worker
    name: otchet-bot
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeployTrigger: commit
    disk:
      name: otchet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Значения задаются в дашборде Render, в репозиторий не попадают.
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # База лежит на постоянном диске, иначе отчеты пропадут при деплое.
      - key: DB_PATH
        value: /var/data/bot.db
      - key: CURRENCY
        value: "€"
      # Без TZ сервер живет по UTC, и «сегодня» в отчете сдвинется.
      - key: TZ
        value: Europe/Berlin
      # Час суточного бэкапа базы админам в Telegram.
      - key: BACKUP_HOUR
        value: "3"
